services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: freshline-sql
    environment:
      ACCEPT_EULA: "Y"
      # Local development only. This database holds nothing but public open data
      # and generated test rows. Azure SQL credentials come from Key Vault, never
      # from a compose file — see infra/.
      MSSQL_SA_PASSWORD: "Freshline_Local_2026!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - freshline-sql-data:/var/opt/mssql
    healthcheck:
      # The container reports healthy long before SQL Server accepts connections,
      # so the check runs an actual query rather than trusting the process to be up.
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  freshline-sql-data:
