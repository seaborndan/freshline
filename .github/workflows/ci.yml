name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first. Nothing here is worth
# paying for twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          # Version comes from global.json so CI and local machines cannot drift.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Restore local tools
        run: dotnet tool restore

      # The integration tests need a real SQL Server, because the property they assert —
      # that a unique index makes a repeated ingestion window a no-op — is not enforced by
      # EF's in-memory provider at all, so a broken upsert would pass against it.
      #
      # Started from docker-compose.yml rather than as a GitHub Actions service container,
      # for a specific reason: a service container needs the SA password written into this
      # file, and no credential belongs in CI YAML. The compose file is the one place the
      # throwaway local password is allowed to live, so CI reuses it and gets an identical
      # database to the one developers run locally as a side effect.
      - name: Start SQL Server
        run: docker compose up -d --wait

      # Build and test run with --no-restore / --no-build so a failure here is a
      # real failure and not a silent second restore hiding a broken lock state.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Stop SQL Server
        if: always()
        run: docker compose down -v

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # VITE_API_BASE_URL is required by vite.config.ts for any production build, because a bundle
      # built without it would ship a site that asks the visitor's own machine for data. CI's build
      # is a compile-and-bundle check whose output is thrown away, never a deployed artifact, so it
      # passes a reserved-by-RFC-2606 host that is guaranteed not to resolve. If this value ever
      # reaches a browser, the requests fail against a name that cannot exist — which is a far
      # louder failure than localhost, and points at this line.
      #
      # The real deploy build sets the real origin by hand. See docs/deployment.md.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ci-build-is-not-deployed.invalid
